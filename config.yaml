# Configuración del pipeline. Las claves (API keys) van en el .env, nunca aquí.
format: long                  # long (5-6 min) | short (~75 s)

# El canal: entra en todos los prompts (src/prompts/), así que otro canal es otro bloque como este.
channel:
  # {{canal}} en los prompts: quién es, en una frase ("Eres el guionista de {{canal}}")
  description: "Datazo, un canal de YouTube en español de ciencia y tecnología: cada vídeo gira alrededor de un dato que sorprende y lo explica hasta que se entiende"
  # {{temas}} en los prompts: de qué van sus vídeos (los ejemplos de los prompts se reparten entre ellos)
  topics: "espacio, física, salud, biología, energía, clima, informática, inteligencia artificial, materiales, ingeniería, inventos"

llm:
  # Proveedores compatibles con la API de OpenAI. api_key: valor fijo;
  # api_key_env: nombre de la variable del .env que la contiene.
  providers:
    local:                                   # con este nombre se comprueba que el modelo esté descargado
      base_url: http://localhost:1234/v1     # LM Studio
      api_key: lm-studio                     # no se usa, pero es obligatorio
      timeout: 300                           # los modelos locales pueden ser lentos
      max_retries: 1
      # Cómo se carga el modelo antes de usarlo (si no, LM Studio usa SUS valores: con 111k de
      # contexto la VRAM se desborda y todo va 5 veces más lento). 16k sobra para un guion.
      # gpu: parte del modelo en la GPU (max = todo). Un modelo que no cabe en los 12 GB (p. ej.
      # Qwen3.6 35B-A3B, ~21,7 GB) necesita una fracción (0.45), pero con 32 GB de RAM va al límite
      # y las peticiones caducan. Comprobar con: lms load <modelo> --estimate-only -c 16384 --gpu max
      load: {context_length: 16384, gpu: max, parallel: 1}
    openrouter:
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      timeout: 120
      max_retries: 3                         # los modelos gratis a veces devuelven 429/503
      requests_per_minute: 16                # los gratis admiten ~20/min: espera en vez de fallar con 429

  # Cada nodo hereda de `default` y sobrescribe lo que ponga.
  # Admite cualquier opción del modelo (max_tokens, top_p...).
  # Texto: Claude Sonnet 5.5 de pago en OpenRouter (2 $ / 10 $ por millón de tokens; ~0,30 $ por
  # short con research, enfoques, esquema, guion, brief y beats).
  # Antes: nvidia/nemotron-3-ultra-550b-a55b:free (gratis, pero se saltaba reglas de los prompts);
  # en local, ministral-3-14b-instruct-2512 (entraba en bucle sin cerrar el JSON), google/gemma-4-12b.
  default:      {provider: openrouter, model: "anthropic/claude-sonnet-5.5", temperature: 0.3,
                 structured_output: json_schema, timeout: 300, max_tokens: 16000}
  # Respaldo de los nodos de texto: si Sonnet falla, ese nodo sigue con este el resto del run.
  # Nemotron 3 Super gratis. Usa su propia temperatura, no la del nodo.
  cloud:        {model: "nvidia/nemotron-3-super-120b-a12b:free"}
  research:     {temperature: 0.3, fallback: cloud}     # sus búsquedas (los hechos: facts)
  deep_research: {temperature: 0.3, fallback: cloud}   # las búsquedas de cada sección (los hechos: facts)
  # Extraer los hechos de cada texto leído (research y deep_research): la mitad del gasto de un vídeo
  # con Sonnet (~0,50 $ en uno largo). Probado 2026-10-14 en el run del reloj nuclear
  # (scripts/compare_facts.py): con los prompts de "no te dejes nada", Haiku 5.5 sacó más datos que
  # Sonnet con los de antes (238 frente a 181), sin errores, por ~0,03 $. Si falla, Sonnet (research).
  facts:        {model: "anthropic/claude-haiku-5.5", temperature: 0.3, fallback: research}
  angles:       {temperature: 0.9, fallback: cloud}   # 3 enfoques distintos
  outline:      {temperature: 0.3, fallback: cloud}
  write_script: {temperature: 0.8, fallback: cloud}
  # Revisor del guion: lo lee entero con los hechos delante antes de tu pausa (datos que no salen de
  # los hechos, tema sin responder, jerga, gancho y cierre; hechos dudosos de los artículos). Una
  # llamada por revisión; lo grave se reescribe solo (review.max_revisions).
  review_script: {temperature: 0.2, fallback: cloud}
  # Rótulos en pantalla (fuente, persona, término clave): una llamada por vídeo con el guion y los hechos
  labels:       {temperature: 0.2, fallback: cloud}
  # Retrato de una persona rotulada: ¿es esta ficha de Wikidata la persona del vídeo? (una llamada por persona con foto)
  portraits:    {model: "anthropic/claude-haiku-5.5", temperature: 0.0, fallback: labels}
  # Plan visual (brief: el universo visual del vídeo; beats: las ideas y sus planos). Es donde más
  # se nota un modelo fuerte (traducir metáforas a planos filmables) y son 2-5 llamadas por vídeo.
  # Con un modelo de OpenRouter (OPENROUTER_API_KEY en el .env): structured_output: json_schema
  # para los modelos con "structured_outputs" en openrouter.ai/models; function_calling para los
  # que solo tienen "tools" (p. ej. nvidia/nemotron-3-ultra-550b-a55b:free, google/gemma-4-31b-it:free).
  # fallback: el nodo que se usa si este falla (429 de un gratis saturado, límite diario...): desde
  # ese fallo, el resto del run va directo a él.
  # Con Sonnet (de `default`). Nemotron se saltaba las reglas de brief.md y beats.md (sujetos
  # repetidos, conceptos y marcas en los prompts).
  brief:        {temperature: 0.5, fallback: cloud}
  beats:        {temperature: 0.4, fallback: cloud}
  # Título, resumen, etiquetas y texto de la miniatura para YouTube (scripts/prepare_upload.py,
  # fuera del pipeline; una llamada por vídeo).
  publish:      {temperature: 0.7, fallback: cloud}
  # Buscador de temas (run_pipeline.py sin --topic, o scripts/find_topics.py; una llamada: ~0,02-0,05 $,
  # y ninguna si no hay entradas nuevas en los feeds).
  topics:       {temperature: 0.4, fallback: cloud}
  # Juez de visuals: elige entre candidatos MIRANDO las imágenes (necesita visión). Una llamada por
  # fragmento: ~20 en un short, ~40 en un largo. Haiku 5.5 (~0,0006 $ por plano, ~0,02 $ por vídeo largo).
  # Prueba 2026-10-15 (16 planos x 3, respuestas fijadas antes; data/runs/20261013-025807/prueba_juez):
  # con el prompt nuevo y las fichas, Haiku aprobó 1 imagen mala de 48 y Gemma 4 31B 5 (Gemma pone
  # 9-10 a casi todo y se guía por "qué debería verse", no por la narración). Si falla: Gemma gratis.
  # No sirven: Qwen2.5 VL 7B local (confundía la nota con el número de imagen y lo rechazaba todo),
  # thinkingmachines/inkling:free (403, "only available on agentic harnesses").
  visuals:      {model: "anthropic/claude-haiku-5.5", temperature: 0.0, max_tokens: 8192,
                 structured_output: function_calling, fallback: visuals_cloud}
  visuals_cloud: {model: "google/gemma-4-31b-it:free", temperature: 0.0, max_tokens: 8192,
                  structured_output: function_calling}
  # judge: {...}                             # juez de las evaluaciones (mejor uno más capaz)
  # Si el guion no convence en local, cambiar solo este nodo:
  # write_script: {provider: openrouter, model: <modelo-fuerte>, temperature: 0.8}
  unload_after_text_phase: true              # lms unload --all al terminar la fase de texto

voice:
  # clone: cada escena con la voz de `reference` (Qwen3-TTS, local). La referencia sale de
  #        scripts/design_voice.py (una voz diseñada) o de una grabación tuya de ~10 s.
  # edge:  voz predefinida de Microsoft (solo PRUEBAS: no cumple la política de YouTube)
  # record: grabas tú cada escena (pendiente)
  mode: clone
  reference: assets/voice_reference.wav
  reference_text: assets/voice_reference.txt        # lo que se dice en reference (exacto)
  clone:
    python: .venv-tts/Scripts/python.exe            # entorno aparte con torch cu128 + qwen-tts
    model: Qwen/Qwen3-TTS-12Hz-1.7B-Base
    design_model: Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign
    language: Spanish
    seed: 1234                                      # mismo texto -> mismo audio
    # De una en una: en lotes, las frases cortas se rellenan para igualar a las largas (antes 4)
    batch_size: 1
    # Azar al generar. Sin esto, el modelo usa temperature 0.9 y top_k 50 (voz y detalle del sonido):
    # la voz "patinaba", cambiaba de tono a mitad de frase y volvía (mariposas, 2026-10-15).
    # Más bajo = más estable y menos expresiva.
    generation: {temperature: 0.7, top_k: 30, subtalker_temperature: 0.7, subtalker_top_k: 30}
  edge: {voice: es-ES-AlvaroNeural, rate: "+0%"}

workers:
  # Entorno con torch (cu128) + transformers donde corren Whisper y SigLIP 2 (src/tts_worker/)
  python: .venv-tts/Scripts/python.exe

align:
  # Tiempo de cada palabra de la narración (para colocar las imágenes y, después, los subtítulos)
  model: openai/whisper-large-v3-turbo
  language: spanish

visuals:
  # Cada fragmento visual (nodo beats) tiene un tipo; sus fuentes, en orden. Si ninguna da un
  # candidato que el modelo con visión puntúe >= min_score, el fragmento se GENERA (Z-Image, sección comfy).
  #   entity:   algo real con nombre propio (persona pública, institución, lugar...)
  #   generic:  algo real pero genérico (gente, calles, objetos, acciones)
  #   data:     una cifra o comparación                                              -> pendiente: gráficos
  #   source:   la noticia o el documento citado                                     -> pendiente: capturas
  #   abstract: una idea que no se puede filmar (en stock, una metáfora visual)
  # Fuentes (sin clave): stock (Pexels/Pixabay: vídeos y fotos), nasa (fotos de NASA: espacio,
  # misiones, la Tierra desde órbita; dominio público), wikimedia (fotos de Wikimedia Commons de cosas
  # reales con nombre; licencias libres que piden atribución: se apuntan en <run>/creditos.txt).
  # Las fuentes de un tipo se reparten los max_candidates (la primera, primero): cada fuente de más
  # quita sitios a stock, la única con vídeo.
  # nasa en todos los vídeos: sus fotos de naves y salas blancas se colaban como "reloj atómico" o
  # "cámara de vacío" con un juez sin fichas; con las fichas (título y descripción de la NASA) Haiku las
  # rechaza y acepta las que sí son del tema (2026-10-15, data/runs/20261013-025807/prueba_juez).
  sources:
    entity: [stock, wikimedia, nasa]
    generic: [stock, nasa]
    data: [stock]
    source: [stock]
    abstract: [stock, nasa]
  beat_seconds: {short: [2, 4], long: [4, 6]}  # duración de cada plano; uno más largo (+20 %) se parte.
                              # long: [5, 10] hasta 2026-10-15 (con photo_max 5 se partían en fotos de 2-5 s);
                              # el autor quiere cada imagen 4-6 s (~60 planos en 5 min)
  # Una foto no se ve más de esto (solo vídeos largos: en los shorts los planos ya son cortos). Un
  # plano más largo busca primero un VÍDEO; si no lo hay, se reparte entre varias imágenes
  # (montaje/05.jpg + 05b.jpg): otra buena o, si no, la misma escena generada con otro encuadre.
  # 7.5: por encima de lo que dura un plano (6 + 20 %), así no parte uno de 7 s en dos de 3,5.
  photo_max_seconds: {long: 7.5}
  # Uno más corto se une al anterior (dentro de su escena: una escena entera más corta se queda así).
  min_beat_seconds: {short: 1.5, long: 4}
  # Planos que beats marca "generate" (objeto protagonista sobre fondo de estudio, escena de época,
  # visualización, algo técnico que ningún banco tiene): se generan sin buscar. false = buscar siempre.
  direct_generate: true
  max_candidates: 16          # candidatos por fragmento (sumando fuentes y búsquedas)
  embed_model: google/siglip2-base-patch16-224  # primer filtro: parecido texto-imagen
  top_k: 8                    # los mejores según SigLIP 2 que ve el modelo con visión
  min_score: 7                # 0-10 del modelo con visión para usar un candidato. 5 hasta 2026-10-15
                              # ("un plano real del tema queda mejor que uno generado"), pero 4-6 es "solo
                              # del mismo tema": colaba imágenes que no enseñaban lo que se dice
  # Generación de lo que no pasa el juez:
  #   openrouter: de pago (OPENROUTER_API_KEY con saldo), generate_model. Nano Banana 2: ~0,10 $
  #               por imagen a 2K, menos a 1K. Si falla (sin saldo, error), el resto se hace con comfy.
  #   comfy:      Z-Image Turbo en local, gratis (ComfyUI arrancado; sección comfy).
  # Otros modelos de imagen en OpenRouter: google/gemini-3-pro-image (Nano Banana Pro, mejor y
  # más caro), black-forest-labs/flux-3-image, krea/krea-2-large, bytedance-seed/seedream-5-0-pro.
  # 2026-10-14: Nano Banana para todas (~0,067 $ por imagen a 1K, ~2-3 $ por vídeo largo: lo que
  # más gasta del vídeo; el coste real de cada una, en <run>/costes.md, visuals_images). ComfyUI de
  # respaldo: arráncalo antes del run, por si Nano Banana falla o rechaza una imagen.
  generator: comfy            # 2026-10-15: Z-Image en local (gratis); al autor le valen sus imágenes.
                              # openrouter = Nano Banana (~2-2,7 $ por vídeo largo)
  generate_model: google/gemini-3.1-flash-image   # Nano Banana 2 (el 2.1 daba 429: cupo de Google agotado)
  generate_resolution: 1K     # 1K | 2K | 4K (no todos los modelos lo admiten: quítalo si da error).
                              # 1K: el vídeo es 1080p como mucho, más no se ve y cuesta más
  # Estilo común a las imágenes generadas (va al final de cada prompt, en inglés). Solo si el
  # brief no da uno (brief.json: style)
  # Solo el acabado: la luz, el color y el encuadre los elige cada plano (con uno fijo, todas las
  # imágenes parecían la misma: reloj nuclear, 2026-10-15)
  image_style: "documentary photograph, realistic, natural colour grading"
  # Estilo de los planos de visualización científica (lo que no se puede fotografiar: un átomo, una
  # molécula, un campo magnético; beats.json: look). Va al final de su prompt en vez del de foto.
  # Sin fondo ni brillo fijos (con "dark background, soft volumetric glow" eran todas iguales).
  visualization_style: "photorealistic scientific visualization as in a science documentary, cinematic lighting, no text, no labels, no diagrams"
  # Fuente stock: bancos en orden de preferencia; uno sin clave en el .env se salta.
  # Límites: Pixabay 100 búsquedas/min, Pexels 200/hora (hasta 6 búsquedas por fragmento: 3
  # consultas x vídeo/foto; las repetidas salen de la caché). Para un vídeo largo, Pexels sube
  # el límite gratis si se lo pides (help.pexels.com); si no, el pipeline espera al llegar al 429.
  stock_providers: [pexels, pixabay]
  per_page: 6                 # resultados por búsqueda (vídeos y fotos)

comfy:
  # Generación de imágenes con Z-Image Turbo (Alibaba, licencia Apache 2.0) en ComfyUI, instalado
  # aparte en C:\Users\hexen\ComfyUI (su propio .venv). Arrancarlo antes del pipeline:
  #   cd C:\Users\hexen\ComfyUI; .venv\Scripts\python.exe main.py --listen 127.0.0.1 --port 8188
  # Modelos (huggingface.co/Comfy-Org/z_image_turbo, split_files/) en ComfyUI\models\:
  # diffusion_models\, text_encoders\, vae\. Más rápido en la RTX 5070, algo menos fino:
  # model: z_image_turbo_nvfp4.safetensors (4,5 GB en vez de 12,3).
  url: http://127.0.0.1:8188
  model: z_image_turbo_bf16.safetensors
  text_encoder: qwen_3_4b.safetensors
  vae: ae.safetensors
  steps: 8                    # es un modelo destilado: 8 pasos, sin CFG
  megapixels: 2.0             # tamaño de la imagen (con la proporción del vídeo); luego se escala al cuadro
  timeout: 900                # segundos máximos por imagen

video:
  # seconds: [mín, máx] de narración; el guion se pide para target_seconds.
  # sections: [mín, máx] secciones del esquema (el guion se escribe sección a sección).
  # short: antes 55 s y luego 45 s (~112 palabras: en Fervo no cabían las cifras ni la comparación).
  # 2026-10-12: ~75 s (~187 palabras) para explicar; probar 4-6 y comparar en YouTube Studio la
  # duración media vista y el % que lo ve en vez de deslizar con los de 45 s.
  short:  {width: 1080, height: 1920, target_seconds: 75, seconds: [65, 85], scenes: [10, 16], sections: [3, 4]}
  # long: 300 s [270, 330] hasta 2026-10-15; 5-6 min para explicar con calma (analogía desarrollada, una historia)
  long:   {width: 1920, height: 1080, target_seconds: 330, seconds: [300, 360], scenes: [24, 40], sections: [4, 5]}
  words_per_second: 2.5       # ritmo de narración en español (~150 palabras/min): fija la longitud del guion
  fps: 30
  loudness_lufs: -14
  scene_gap: 0.15             # segundos de pausa tras la narración de cada escena
  encoder: auto               # auto (h264_nvenc si hay GPU NVIDIA, si no libx264) | h264_nvenc | libx264
  quality: 21                 # calidad constante del vídeo final (menor = mejor y más pesado)
  # Subtítulos quemados (tiempos de align). words: máximo de palabras por subtítulo (0 = sin subtítulos);
  # seconds: máximo que dura cada uno. highlight: true = pocas palabras con la que se dice resaltada
  # (estilo Shorts); false = frases clásicas en 1-2 líneas, cortadas en los puntos (y en las comas si
  # ya son largas). El .srt de YouTube (prepare_upload) se hace aparte, igual para los dos.
  subtitles:
    short: {words: 3, seconds: 2, highlight: true}
    long:  {words: 14, seconds: 5, highlight: false}
  # Fundido cruzado entre ESCENAS (segundos; 0 = corte seco). Dentro de una escena siempre corte seco.
  transition: {short: 0.3, long: 0.4}
  # Rótulos (nodo labels -> <run>/rotulos.json, editable; graph/onscreen.py los dibuja arriba a la
  # izquierda): la fuente de un estudio, el nombre y cargo de quien se cita, el término clave en rojo.
  # seconds: cuánto se ve cada tipo. enabled: false = sin rótulos.
  # portraits: la foto de la persona junto a su rótulo, si Wikidata tiene una con licencia libre y es
  # seguro ella (en rotulos.json: "foto"; bórrala ahí para quitarla). false = solo el texto.
  labels: {enabled: true, portraits: true, seconds: {fuente: 4.5, persona: 4.5, termino: 3.0}}
  # Música: la tuya, montaje/musica.mp3 en la pausa review_visuals (sin ella, sin música). Volumen FIJO
  # (sin ducking): db por debajo de la voz (-17 más alta, -23 más baja); eq_db: hueco en 1-4 kHz para la voz.
  music: {db: -20, eq_db: -4, fade_in: 2, fade_out: 3}
  # 2.5D en las fotos: el modelo de profundidad (GPU, .venv-tts; ~100 MB, se descarga la primera vez)
  # separa primer plano y fondo y el primer plano se mueve un poco más. strength: cuánto (sutil: 0.015-0.03).
  # Si falla, movimiento normal. Las fotos planas (gráficos, capturas) se mueven sin profundidad.
  # Apagado (2026-10-15): al autor no le gusta; las fotos se mueven igual (zoom, paneos), sin profundidad.
  parallax: {enabled: false, strength: 0.02, model: depth-anything/Depth-Anything-V2-Small-hf}
  font: Arial                 # subtítulos; se busca en fonts_dir y, si está vacía, en las del sistema
  fonts_dir: assets/fonts

research:
  # Dos tipos de vídeo (--type en run_pipeline.py; sin él, lo decide el modelo a partir del tema):
  #   news:      algo que acaba de pasar -> búsquedas de noticias
  #   explainer: algo que no caduca (cómo funciona, por qué pasa) -> la web general + Wikipedia
  queries: 4                  # búsquedas que genera el LLM a partir del tema
  results_per_query: 5
  max_articles: {short: 4, long: 6}   # textos leídos (Wikipedia incluida); short antes 3
  max_article_chars: 6000     # ~1.700 tokens por artículo al extraer hechos
  region: es-es               # solo DuckDuckGo; el buscador se elige con SEARCH_PROVIDER en el .env (tavily)
  # Webs que nunca son una fuente: tiendas, anuncios, redes sociales y foros. "forocoches.com" es esa
  # web y sus subdominios; un nombre sin punto ("mercadolibre") es esa web en cualquier país.
  # Tus --url se leen siempre. (Un vídeo de motor sacó datos de un anuncio de MercadoLibre.)
  skip_domains: [mercadolibre, mercadolivre, ebay, aliexpress, temu, wallapop, milanuncios, coches.net,
                 autoscout24, pinterest, facebook.com, instagram.com, tiktok.com, x.com, twitter.com,
                 reddit.com, quora.com, forocoches.com, youtube.com]
  # Investigación por secciones (nodo deep_research, tras aprobar el esquema): el CONTEXTO de cada
  # sección (cómo funciona, historia, protagonistas, riesgos...) en la web y en Wikipedia. Solo si
  # alguna sección del esquema tiene preguntas; luego para en review_research.
  # short antes false: un minuto sobre cómo funciona algo no sale de una cita en un periódico.
  deep: {short: true, long: true}
  deep_sources_per_section: 4     # textos leídos por sección (web + Wikipedia); ~1 llamada al LLM cada uno
  deep_results_per_query: 3       # resultados de cada búsqueda web
  words_per_fact: 22              # cuánto guion da un dato: una sección con pocos datos se acorta
                                  # (nunca se rellena) y una sin datos se quita

topics:
  # Buscador de temas (run_pipeline.py sin --topic, o scripts/find_topics.py): lee estos feeds, el
  # modelo puntúa las entradas NUEVAS (las que no están en registro.json) para el canal y deja
  # data/temas/<fecha>.md con los candidatos y el comando de cada uno (--url a sus fuentes). url: el feed o la portada de la web (se busca su feed). kind: solo orientativo.
  # skip: trozos de URL que se descartan (secciones de ofertas, análisis de productos, historia...).
  # Los que fallen salen al final del .md. Comprobados 2026-10-12; no dan feed o lo bloquean: SINC,
  # EurekAlert (404) y New Scientist (406).
  feeds:
    - {url: "https://www.xataka.com/feedburner.xml", name: Xataka, kind: tecnología,
       skip: [/seleccion/, /analisis/, /cine-y-tv/, /magnet/, /empresas-y-economia/]}
    - {url: "https://www.muyinteresante.com/rss", name: Muy Interesante, kind: ciencia,
       skip: [/bazar/, /historia/, /actualidad/]}
    - {url: "https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/section/ciencia/portada", name: El País Ciencia, kind: ciencia}
    - {url: "https://www.sciencedaily.com/rss/all.xml", name: ScienceDaily, kind: ciencia}
    - {url: "https://phys.org/rss-feed/", name: Phys.org, kind: ciencia}
    - {url: "https://www.nature.com/nature.rss", name: Nature, kind: ciencia}
    - {url: "https://www.nasa.gov/feed/", name: NASA, kind: espacio}
    - {url: "https://www.esa.int/rssfeed/Our_Activities/Space_Science", name: ESA, kind: espacio}
    - {url: "https://www.quantamagazine.org/feed/", name: Quanta, kind: ciencia}
    - {url: "https://arstechnica.com/science/feed/", name: Ars Technica Ciencia, kind: ciencia}
    - {url: "https://www.technologyreview.com/feed/", name: MIT Technology Review, kind: tecnología,
       skip: [/the-download-]}                                   # resúmenes diarios de otras noticias
    - {url: "https://spectrum.ieee.org/feeds/feed.rss", name: IEEE Spectrum, kind: tecnología,
       skip: [knowledgehub.wiley.com, career, -ieee]}           # patrocinado y promoción del IEEE
    - {url: "https://www.wired.com/feed/category/science/latest/rss", name: Wired Ciencia, kind: ciencia}
    - {url: "https://www.space.com/feeds/all", name: Space.com, kind: espacio,
       skip: [/entertainment/, on-this-day-in-space, space-photo-of-the-day]}
    - {url: "https://www.scientificamerican.com/platform/syndication/rss/", name: Scientific American,
       kind: ciencia, skip: [/podcast/]}
    - {url: "https://techcrunch.com/feed/", name: TechCrunch, kind: tecnología,
       skip: [techcrunch-disrupt, /sponsored/]}                 # promoción de su propio evento
    # De pago: el titular sirve como pista, pero el artículo no se puede leer (el research busca
    # el mismo tema en otras webs).
    - {url: "https://www.theinformation.com/feed", name: The Information, kind: tecnología}
  # Probados 2026-10-12 sin feed: tech.yahoo.com (ninguna sección tiene RSS), es.tradingview.com/news;
  # bloquean (403): mdpi.com. Finanzas, fuera del canal: es.investing.com/rss/news.rss (funciona).
  days: 7                     # solo entradas de los últimos N días (--days)
  max_per_feed: 15            # para que una web con muchas entradas no se coma la lista
  max_entries: 250            # las que ve el modelo (~80 tokens cada una: 250 son ~0,04 $ con Sonnet);
                              # si se pasa, se quedan las más recientes
  max_candidates: 10          # temas propuestos (--top)
  reserve_days: 30            # un tema propuesto y no elegido se sigue ofreciendo estos días
  out_dir: data/temas         # aquí van los .md de cada búsqueda y registro.json (todos los temas y su estado)

script:
  # Un guion de hasta estas palabras se escribe (y se reescribe) ENTERO en una llamada: los shorts y
  # los largos de 5-6 min (~900). Más largo, una llamada por sección. Por secciones, cada una repetía
  # las ideas de las otras (mariposas, 2026-10-15). Las reescrituras por secciones rompían el enlace.
  whole_max_words: 1200

review:
  # Veces seguidas que review_script manda reescribir el guion por algo grave antes de tu pausa (cada
  # una: una llamada al guionista y otra al revisor). Lo que quede, lo ves en la pausa y en script.md.
  # 1 hasta 2026-10-15: lo grave que encontraba la segunda revisión llegaba siempre a la pausa.
  max_revisions: 2
  # Todas las revisiones de todos los vídeos, una por línea: para ver qué errores se repiten y
  # corregirlos en el prompt del guionista (no vídeo a vídeo).
  log: data/revisiones.jsonl

youtube:
  # Fuera del pipeline: scripts/prepare_upload.py (run -> carpeta lista) y scripts/upload_youtube.py
  # (carpeta -> YouTube). Ver src/services/publish.py y src/services/youtube.py.
  ready_dir: data/listo_para_subir     # una carpeta por vídeo: video.mp4, metadata.json, descripcion.md...
  uploaded_dir: data/subidos           # adonde pasa la carpeta tras subirla (con youtube.json)
  client_secret: data/youtube/client_secret.json   # credencial OAuth de escritorio (Google Cloud)
  token: data/youtube/token.json       # se crea al autorizar tu canal la primera vez
  privacy: private            # private | unlisted | public (sin auditoría de Google, la API solo sube privado)
  category_id: 28             # 28 Ciencia y tecnología · 25 Noticias y política · 27 Educación
  default_language: es
  made_for_kids: false
  thumbnail_font: C:/Windows/Fonts/ariblk.ttf   # Arial Black; la miniatura lleva 2-4 palabras grandes
